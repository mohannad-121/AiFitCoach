<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="iconGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="196" height="196" rx="34" fill="none" stroke="#f97316" stroke-width="2" stroke-opacity="0.25" />

  <!-- Dumbbell centered -->
  <rect x="56" y="96" width="88" height="14" rx="7" fill="url(#iconGrad2)" />
  <rect x="44" y="82" width="16" height="42" rx="6" fill="url(#iconGrad2)" />
  <rect x="30" y="88" width="13" height="30" rx="5" fill="#f97316" opacity="0.65" />
  <rect x="140" y="82" width="16" height="42" rx="6" fill="url(#iconGrad2)" />
  <rect x="157" y="88" width="13" height="30" rx="5" fill="#f97316" opacity="0.65" />

  <!-- AI heartbeat pulse line -->
  <polyline
    points="50,68 70,68 78,50 88,84 96,60 104,72 112,68 150,68"
    fill="none"
    stroke="#f97316"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow2)"
  />

  <!-- Neural pulse nodes -->
  <circle cx="78" cy="50" r="5" fill="#f97316" filter="url(#glow2)" />
  <circle cx="96" cy="60" r="4.5" fill="#fb923c" filter="url(#glow2)" />
  <circle cx="104" cy="72" r="3.5" fill="#fdba74" />

  <!-- Text: "Ai" + "Fit" + "Coach" -->
  <text
    x="100"
    y="152"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#ffffff"
  >AiFit<tspan fill="#f97316" font-weight="300">Coach</tspan></text>

  <!-- Tagline -->
  <text
    x="100"
    y="173"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="9"
    font-weight="400"
    letter-spacing="2.5"
    fill="#64748b"
  >AI FITNESS COACHING</text>
</svg>
