<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background pill for icon -->
  <rect x="6" y="10" width="80" height="80" rx="20" fill="#0f172a" />
  <rect x="8" y="12" width="76" height="76" rx="18" fill="#1e293b" />

  <!-- Dumbbell icon -->
  <rect x="26" y="44" width="40" height="8" rx="4" fill="url(#iconGrad)" />
  <rect x="20" y="38" width="8" height="20" rx="3" fill="url(#iconGrad)" />
  <rect x="14" y="41" width="5" height="14" rx="2.5" fill="#f97316" opacity="0.7" />
  <rect x="64" y="38" width="8" height="20" rx="3" fill="url(#iconGrad)" />
  <rect x="73" y="41" width="5" height="14" rx="2.5" fill="#f97316" opacity="0.7" />

  <!-- AI pulse line above dumbbell -->
  <polyline
    points="22,32 30,32 34,22 38,40 42,28 46,36 50,32 70,32"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Three AI dots (neural nodes) -->
  <circle cx="34" cy="22" r="2.5" fill="#f97316" filter="url(#glow)" />
  <circle cx="42" cy="28" r="2.5" fill="#fb923c" filter="url(#glow)" />
  <circle cx="46" cy="36" r="2" fill="#fdba74" />

  <!-- Wordmark: "AiFit" bold + "Coach" lighter -->
  <text
    x="104"
    y="58"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="38"
    font-weight="800"
    letter-spacing="-1"
    fill="#ffffff"
  >AiFit</text>
  <text
    x="104"
    y="58"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="38"
    font-weight="800"
    letter-spacing="-1"
    fill="none"
  >AiFit</text>
  <text
    x="218"
    y="58"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="38"
    font-weight="300"
    letter-spacing="-0.5"
    fill="#f97316"
  >Coach</text>

  <!-- Tagline -->
  <text
    x="105"
    y="76"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="12"
    font-weight="400"
    letter-spacing="3"
    fill="#94a3b8"
  >AI-POWERED FITNESS COACHING</text>
</svg>
